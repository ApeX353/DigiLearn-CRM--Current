server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Long-cache fingerprinted build assets
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # SPA fallback — React Router owns all paths, so unknown URLs
    # (e.g. a refresh on /leads or /deals/<id>) must serve index.html
    # instead of a 404.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
